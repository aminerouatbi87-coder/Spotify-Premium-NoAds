<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rap Player Premium - No Ads 🔥</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-fire"></i>
                <h1>RAP PLAYER</h1>
                <span class="badge">PREMIUM</span>
            </div>
            
            <nav class="nav">
                <a href="#" class="nav-item active" data-page="home">
                    <i class="fas fa-home"></i> Accueil
                </a>
                <a href="#" class="nav-item" data-page="search">
                    <i class="fas fa-search"></i> Recherche
                </a>
                <a href="#" class="nav-item" data-page="playlists">
                    <i class="fas fa-list"></i> Playlists
                </a>
                <a href="#" class="nav-item" data-page="favorites">
                    <i class="fas fa-heart"></i> Favoris
                </a>
            </nav>

            <div class="genres">
                <h3>🎵 Genres</h3>
                <button class="genre-btn active" data-genre="all">Tous</button>
                <button class="genre-btn" data-genre="Rap FR">Rap FR 🇫🇷</button>
                <button class="genre-btn" data-genre="Rap US">Rap US 🇺🇸</button>
                <button class="genre-btn" data-genre="Afrobeats">Afrobeats 🌍</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="🔍 Rechercher un artiste, chanson..." class="search-input">
                </div>
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                </div>
            </header>

            <!-- Pages -->
            <div class="pages">
                <!-- Home Page -->
                <div class="page active" id="home-page">
                    <!-- Top Songs -->
                    <section class="section">
                        <h2>🔥 Top Hits</h2>
                        <div class="songs-grid" id="topSongsGrid"></div>
                    </section>

                    <!-- Playlists -->
                    <section class="section">
                        <h2>📋 Playlists</h2>
                        <div class="playlists-grid" id="playlistsGrid"></div>
                    </section>

                    <!-- Rap FR -->
                    <section class="section">
                        <h2>🇫🇷 Rap FR</h2>
                        <div class="songs-list" id="rapFrList"></div>
                    </section>

                    <!-- Rap International -->
                    <section class="section">
                        <h2>🌍 Rap International</h2>
                        <div class="songs-list" id="rapIntlList"></div>
                    </section>
                </div>

                <!-- Search Page -->
                <div class="page" id="search-page">
                    <div class="search-results" id="searchResults"></div>
                </div>

                <!-- Playlists Page -->
                <div class="page" id="playlists-page">
                    <div class="playlists-container" id="playlistsContainer"></div>
                </div>

                <!-- Favorites Page -->
                <div class="page" id="favorites-page">
                    <div class="favorites-container" id="favoritesContainer"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Player -->
    <div class="player">
        <div class="player-content">
            <div class="now-playing-info">
                <div class="song-cover">🎤</div>
                <div class="song-details">
                    <h3 id="playerTitle">Sélectionnez une chanson</h3>
                    <p id="playerArtist">Artiste</p>
                </div>
            </div>

            <div class="player-controls">
                <button id="prevBtn" class="control-btn"><i class="fas fa-step-backward"></i></button>
                <button id="playBtn" class="control-btn play-btn"><i class="fas fa-play"></i></button>
                <button id="nextBtn" class="control-btn"><i class="fas fa-step-forward"></i></button>
            </div>

            <div class="progress-bar">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressSlider" min="0" max="100" value="0" class="slider">
                <span id="duration">0:00</span>
            </div>

            <div class="player-right">
                <button id="volumeBtn" class="control-btn"><i class="fas fa-volume-up"></i></button>
                <input type="range" id="volumeSlider" min="0" max="100" value="70" class="slider">
            </div>
        </div>
    </div>

    <!-- Audio Element (hidden) -->
    <audio id="audioPlayer"></audio>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
